# Fly.io config for LIPLAB DEV/STAGING (develop branch). Separate from exhibition app `liplab`.
app = "liplab-dev"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    WITH_ML = "1"   # 서버 추론(D-GOP 발음채점·음성구동 아바타). 전시앱 fly.toml은 기본값 0이라 이미지가 그대로다.

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DATABASE_URL = "sqlite+aiosqlite:////data/liplab.db"
  LIPLAB_AI_ITEMS = "0"   # dev: static curriculum (no live LLM key). Rule-based features work fully.
  LIPLAB_UNLOCK_ALL = "demo"   # 둘러보기 데모 계정만 전 단계 열기, 실사용·파일럿 계정은 숙달 순서대로
  DGOP_ALIGNER_ID = "kresnik/wav2vec2-large-xlsr-korean"   # D-GOP 발음채점 켜기(공개 모델, 앵커는 dgop_calibration_kresnik.json 자동)
  HF_HUB_OFFLINE = "1"         # 모델은 이미지 안에 있다. 팀원 비공개 모델로 바꾸면 지우고 HF_TOKEN을 시크릿으로 넣는다
  LIPLAB_WARMUP = "1"          # 기계가 켜질 때 모델을 뒤에서 미리 올린다(첫 요청 대기 줄임)
  LIPLAB_REVIEW = "1"          # 콘텐츠 검수 화면. 검수자 이메일은 fly secrets set LIPLAB_ADMIN_EMAILS=... (없으면 아무도 못 씀)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2          # 발음채점 추론(wav2vec2-large, CPU) 지연을 줄인다
  memory_mb = 4096  # 모델 두 개(각 약 1.2GB) + torch

[[mounts]]
  source = "liplab_data"
  destination = "/data"
