# Fly.io config for LIPLAB DEV/STAGING (develop branch). Separate from exhibition app `liplab`.
app = "liplab-dev"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    WITH_ML = "1"   # 서버 추론(D-GOP 발음채점·음성구동 아바타). 전시앱 fly.toml은 기본값 0이라 이미지가 그대로다.
    DGOP_MODEL = "ours"   # 자체 학습 정렬기·채점기(9/25 재검 통과). 체크포인트는 backend/models/dgop_ours/에 둔다(git 제외, DEPLOY.md 9항)
    # S4 스트리밍 채점(10/17 판정 통과, 10/21 켬, 사용자 결정 10/18). "1"이면 프론트 VITE_DGOP_STREAM과 서버 DGOP_STREAM을 함께 켜고, 학생 ONNX와 보정
    # (backend/models/dgop_stream/, git 제외)이 없으면 빌드가 멈춘다. 켜는 절차·되돌리기는 DEPLOY.md 10항
    DGOP_STREAM = "1"
    # 독화 ① 화소 입술 ROI(R2 s0, 10/21 판정 통과 4지 58.7%, 10/28 사용자 결정으로 dev만 켬). 모델(frontend/public/models/roi/, git 제외)이
    # 없으면 빌드가 멈춘다. 되돌리기는 "0"으로 다시 빌드(DEPLOY.md 11항)
    LIPREAD_ROI = "1"

[env]
  LIPLAB_USAGE_LOG = "1"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DATABASE_URL = "sqlite+aiosqlite:////data/liplab.db"
  LIPLAB_AI_ITEMS = "0"   # dev: static curriculum (no live LLM key). Rule-based features work fully.
  LIPLAB_UNLOCK_ALL = "demo"   # 둘러보기 데모 계정만 전 단계 열기, 실사용·파일럿 계정은 숙달 순서대로
  LIPLAB_LISTEN_BETA_OPEN = "1"   # dev 실사용 테스트 기간에만 듣기 전 단계 열기
  # D-GOP 발음채점: 자체 학습 정렬기·채점기와 그 앵커. 공개 kresnik으로 되돌리려면 DGOP_MODEL = "kresnik"으로 빌드하고
  # DGOP_ALIGNER_ID = "kresnik/wav2vec2-large-xlsr-korean"만 남긴다(앵커는 dgop_calibration_kresnik.json 자동)
  # 체크포인트는 미리 변환한 int8 파일(model.int8.safetensors, 9/26, scripts/export_int8.py)이라 켜질 때 읽는 양이 1/3.5
  DGOP_ALIGNER_ID = "/app/models/dgop_ours/aligner"
  DGOP_SCORER_ID = "/app/models/dgop_ours/scorer"
  DGOP_CALIBRATION = "/app/data/dgop_calibration_ours.json"
  DGOP_STREAM_MODEL = "/app/models/dgop_stream/student_w8.onnx"   # S4 학생. 빌드 인자 DGOP_STREAM이 "0"이면 쓰지 않는다(보정은 옆의 calibration.json)
  HF_HUB_OFFLINE = "1"         # 모델은 이미지 안에 있다
  BACKBONE_QUANT = "int8"      # 정렬기·채점기 선형층 가중치 int8(quant_int8.py). 9/25 사전등록 점검 통과: 표시 점수 차 평균 0.2점,
                               # 호스팅 점검 최대 3.15GB(fp32 4.3GB). 아바타 백본은 fp32. 빌드 폴더에 int8 파일만 있으면 이 값과
                               # 상관없이 int8로 오른다. fp32로 돌리려면 fp32 체크포인트를 싣고 이 줄을 지운 뒤 8GB·4CPU로
  LIPLAB_WARMUP = "1"          # 기계가 켜질 때 모델을 뒤에서 미리 올리고 아바타 백본 가중치까지 읽어 둔다(첫 요청 대기 줄임)
  LIPLAB_REVIEW = "1"          # 콘텐츠 검수 화면. 검수자 이메일은 fly secrets set LIPLAB_ADMIN_EMAILS=... (없으면 아무도 못 씀)

[http_service]
  internal_port = 8080
  force_https = true
  # 쉬면 멈추지 않고 일시정지한다(메모리째 저장, 요금은 멈춤과 같이 저장 공간만). 9/26 수동 시험: 4GB 기계가 8초 만에
  # 일시정지됐고, 깨운 뒤 첫 발음 채점 3.6초·첫 아바타 3.1초(멈췄다 켜면 모델 적재에 약 4분). 스냅샷은 배포하면 버려지고
  # fly가 보존을 보장하지 않으므로, 그때는 예열(LIPLAB_WARMUP)이 다시 올린다. fly 문서는 2GB 넘는 기계에 권하지 않는다
  # (일시정지 시간이 길어서). 문제가 생기면 "stop"으로 되돌린다.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2          # 발음채점 추론(wav2vec2-large, CPU) 지연을 줄인다
  memory_mb = 4096  # 정렬기·채점기 int8(각 약 0.4GB) + 아바타 백본 fp32(1.26GB) + torch. 9/25 점검 최대 3.15GB, 채점 뒤 2.7GB

[[mounts]]
  source = "liplab_data"
  destination = "/data"
