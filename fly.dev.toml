# Fly.io config for LIPLAB DEV/STAGING (develop branch). Separate from exhibition app `liplab`.
app = "liplab-dev"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DATABASE_URL = "sqlite+aiosqlite:////data/liplab.db"
  LIPLAB_AI_ITEMS = "0"   # dev: static curriculum (no live LLM key). Rule-based features work fully.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "liplab_data"
  destination = "/data"
