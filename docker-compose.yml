# Docker Compose for local development
version: '3.8'

services:
  liplab:
    build: .
    ports:
      - "8080:8080"
    environment:
      # 기본값을 두지 않는다: 공개 저장소의 기본 서명키로 켜면 누구나 임의 사용자 토큰을 만들 수 있다(auth.py는 이 값을 못 막는다)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET를 설정하세요}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////data/liplab.db}   # 아래 볼륨(./data)에 둔다
      - PORT=8080
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

